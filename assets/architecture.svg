  <text x="750" y="446" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">2. Recipe Tuning Ledger (Offsets/POR)</text>
  <text x="750" y="464" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="9">3. Visual Graph Workbench (knowledge_graph.html)</text>
